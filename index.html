<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلیس من - حساب کاربری</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.3/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #f2f2f2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* هدر آبی بالای صفحه */
        .top-header {
            width: 100%;
            background-color: #4f7cff;
            height: 220px;
            position: relative;
            display: flex;
            justify-content: center;
        }

        /* نوار سفید بالای هدر (شبیه آدرس بار) */
        .browser-bar {
            width: 90%;
            max-width: 1200px;
            background-color: rgba(255, 255, 255, 0.2);
            height: 50px;
            margin-top: 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        /* دکمه خروج از حساب */
        .logout-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            position: absolute;
            top: 30px;
            left: 5%;
        }

        /* کانتینر اصلی کارت */
        .main-content {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -70px; /* کشیدن کارت روی هدر */
            padding-bottom: 50px;
        }

        .card {
            background: #f9f9f9;
            width: 90%;
            max-width: 800px;
            border: 1px solid #888;
            border-radius: 15px;
            position: relative;
            padding: 50px 40px 30px 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* نام کاربر (بالای کارت) */
        .user-name {
            position: absolute;
            top: -20px;
            right: 50%;
            transform: translateX(50%);
            background: #fff;
            border: 1px solid #999;
            border-radius: 20px;
            padding: 5px 40px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        /* اطلاعات شخصی */
        .info-list {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 25px;
            color: #333;
            font-size: 15px;
            font-weight: 500;
        }

        /* کادر کد پستی */
        .postal-section {
            border: 1px solid #bbb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fff;
        }

        .postal-label {
            font-size: 13px;
            color: #333;
            margin-bottom: 15px;
            text-align: right;
        }

        .postal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #777;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
            text-align: left;
            margin-bottom: 15px;
        }

        .btn-disabled {
            background-color: #e5e5e5;
            color: #888;
            border: none;
            padding: 10px 30px;
            border-radius: 6px;
            cursor: not-allowed;
            font-size: 14px;
            float: left;
        }

        /* بخش پایین (وضعیت و کارت گواهی) */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .status-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .refresh-icon {
            color: #555;
            font-size: 18px;
            cursor: pointer;
        }

        /* کارت گواهی نامه (کادر آبی کوچک) */
        .license-card {
            width: 220px;
            background: linear-gradient(135deg, #d4ebf9 0%, #e8f4f8 100%);
            border: 1px solid #a3c4dc;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* نوار قرمز کارت */
        .red-stripe {
            position: absolute;
            top: 15px;
            left: -25px;
            width: 90px;
            height: 15px;
            background-color: #d92323;
            transform: rotate(-45deg);
        }

        /* لوگو */
        .logo-container {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            background: transparent;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .license-title {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .license-details {
            font-size: 11px;
            color: #444;
            line-height: 1.6;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 768px) {
            .card { padding: 40px 20px 20px 20px; }
            .bottom-section { flex-direction: column; gap: 20px; }
            .logout-btn { top: 10px; left: 10px; }
            .top-header { height: 180px; }
            .main-content { margin-top: -50px; }
        }
    </style>
</head>
<body>

    <!-- هدر بالای صفحه -->
    <div class="top-header">
        <div class="browser-bar"></div>
        <button class="logout-btn">خروج از حساب</button>
    </div>

    <!-- محتوای اصلی -->
    <div class="main-content">
        <div class="card">
            <div class="user-name">محمد جودکی</div>

            <div class="info-list">
                <div>شماره ملی: ۳۸۰۱۶۳۶۷۵۵</div>
                <div>تاریخ تولد: ۱۳۴۴/۰۱/۰۲</div>
                <div>شماره تلفن همراه: --</div>
            </div>

            <div class="postal-section">
                <div class="postal-label">جهت احراز در سامانه املاک و اسکان کد پستی خود را وارد کنید</div>
                <input type="text" class="postal-input" placeholder="">
                <div class="clearfix">
                    <button class="btn-disabled">احراز محل سکونت</button>
                </div>
            </div>

            <div class="bottom-section">
                <div class="status-area">
                    <div class="status-text">وضعیت گواهی‌نامه: در انتظار تایید</div>
                    <div class="refresh-icon">⟳</div>
                </div>

                <!-- کارت گواهی نامه -->
                <div class="license-card">
                    <div class="red-stripe"></div>
                    <div class="logo-container">
                        <!-- لینک لوگوی خود را اینجا قرار دهید -->
                        <!-- <img src="YOUR_LOGO_LINK_HERE" alt="لوگو"> -->
                    </div>
                    <div class="license-title">گواهی نامه رانندگی</div>
                    <div class="license-details">
                        پایه سوم<br>
                        تاریخ صدور: ۱۴۰۴/۰۱/۲۷<br>
                        شماره گواهی نامه: ۴۰۴۸۹۳۵۵۸۷<br>
                        اعتبار: ۱۰ سال
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
              </html>
